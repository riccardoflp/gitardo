[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/views",
    "crates/ui",
    "crates/editor",
    "crates/render",
    "crates/platform",
    "crates/system",
    "crates/features",
    "crates/engine",
    "crates/git",
    "crates/model",
    "crates/text",
    "crates/json",
    "crates/settings",
    "crates/http",
    "crates/tls",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_results = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
