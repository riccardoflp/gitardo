[package]
name = "engine"
description = "What runs the plans of Gitardo Desktop: preview, steps, the log, the undo journal, activity and follow-ups."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
git = { path = "../git" }
http = { path = "../http" }
json = { path = "../json" }
model = { path = "../model" }
system = { path = "../system" }

[dev-dependencies]
# The server of the tests on 127.0.0.1, which answers for api.github.com over TLS.
http = { path = "../http", features = ["test-server"] }
testkit = { path = "../testkit" }
