[package]
name = "engine"
description = "What runs the plans of Gitardo Desktop: preview, steps, the log, the undo journal, activity and follow-ups."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# GitHub's own SDK for the GitHub Copilot CLI (`ai.copilot`, D87): it keeps the protocol the CLI speaks, which changes
# with it. Pinned exactly, since it is a preview; without its default features it is the client alone, spoken to over
# the streams of the CLI Gitardo starts: no CLI downloaded, no runtime loaded into Gitardo, no OpenSSL, no HTTP.
copilot-sdk = { version = "=2.0.2-preview.7", default-features = false }
# The runtime the SDK runs on, of one thread, kept inside `engine::ai::copilot` (R1.6).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "sync", "macros"] }
git = { path = "../git" }
http = { path = "../http" }
json = { path = "../json" }
model = { path = "../model" }
system = { path = "../system" }

[dev-dependencies]
# The server of the tests on 127.0.0.1, which answers for api.github.com over TLS.
http = { path = "../http", features = ["test-server"] }
testkit = { path = "../testkit" }
