[package]
name = "server"
description = "gitardo-engine: Gitardo's engine without a window, spoken to by the extension for VS Code over its standard input and output."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gitardo-engine"
path = "src/main.rs"

# serde and serde_json are used here and in protocol only (rule R1.7): the messages are read and written with them.
[dependencies]
engine = { path = "../engine" }
features = { path = "../features" }
git = { path = "../git" }
http = { path = "../http" }
json = { path = "../json" }
model = { path = "../model" }
protocol = { path = "../protocol" }
settings = { path = "../settings" }
# The watcher of folders, for the git folders of the repositories opened (D93): `system` links no library of a window.
system = { path = "../system" }
text = { path = "../text" }
serde = "1.0.229"
serde_json = "1.0.154"

[dev-dependencies]
testkit = { path = "../testkit" }

[lints]
workspace = true
