[package]
name = "render"
description = "The pixels of Gitardo Desktop: the frame buffer, shapes, anti-aliasing, fonts and glyphs, icons and themes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
testkit = { path = "../testkit" }

[dependencies]
# - png-format: the images of a repository a preview of Markdown draws (`file-view.markdown-preview`), read by the
#   png library tiny-skia takes for it; no other format of images is read.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
# =0.16.2, the version `merman` (crate `text`) asks for.
svgtypes = { version = "=0.16.2", default-features = false, features = ["std"] }
# The diagrams of Mermaid in the preview of Markdown (`file-view.mermaid`, D60), whose SVG is drawn into pixels with the
# fonts of the program. 0.47.0, the release that shares fontdb with cosmic-text, svgtypes with this crate and tiny-skia
# with the window; only its feature `text`: no fonts of the system, no image decoders, no compressed SVG.
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
# JPEG, GIF, WebP, BMP and ICO, wherever an image file is shown (`file-view.read-image`, D74): one library for the five,
# weighed as D22 says, against five decoders kept apart and BMP and ICO written here. Only those five formats, no
# threads of its own; it brings the decoders of zune-jpeg, gif and image-webp, and the png tiny-skia already uses.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "gif", "webp", "bmp", "ico"] }
