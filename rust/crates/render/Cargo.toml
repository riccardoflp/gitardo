[package]
name = "render"
description = "The pixels of Gitardo Desktop: the frame buffer, shapes, anti-aliasing, fonts and glyphs, icons and themes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
testkit = { path = "../testkit" }

[dependencies]
# - png-format: the images of a repository a preview of Markdown draws (`file-view.markdown-preview`), read by the
#   png library tiny-skia takes for it; no other format of images is read.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
svgtypes = { version = "=0.16.1", default-features = false, features = ["std"] }
