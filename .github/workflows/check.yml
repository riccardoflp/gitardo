# The pipeline of stage 9 of docs/transition/06-roadmap.md: on every push of a branch, the checks of the Rust workspace
# and of the extension on Windows, Linux and macOS, the engine of every target of the Marketplace, the seven vsix, and
# the desktop of each system, all kept as artifacts. It publishes, pushes and tags nothing. A tag runs it through
# release.yml, which publishes what it made once the maintainer approves (D52).

name: Check

on:
  push:
    # A tag is checked by release.yml, which calls this workflow: on its own it would run twice.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A debug build without its debug information is a third of the size, and the tests need no debugger.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  workspace:
    name: Rust workspace (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            os: windows-latest
          - system: Linux
            os: ubuntu-latest
          - system: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The libraries the window needs on Linux, Xvfb and Weston
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev pkg-config xvfb weston
      # rustup installs the toolchain rust-toolchain.toml names, with rustfmt and clippy, on first use.
      - name: The toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: workspace-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # The runners have no identity of their own for the commits the tests make, and Windows' git turns line endings
      # into CRLF on checkout, which the tests' repositories must not.
      - name: Git for the tests
        run: |
          git config --global user.name "Gitardo tests"
          git config --global user.email "tests@gitardo.invalid"
          git config --global core.autocrlf false
      - name: cargo xtask check
        run: cargo xtask check
      # The tests of platform that open windows, use the clipboard or watch folders return at once without a display, as
      # in the check above: here they run on X11 (Xvfb) and on Wayland alone, under Weston with its headless backend,
      # with WAYLAND_DISPLAY set and no DISPLAY, so that nothing goes through XWayland (milestone M29).
      - name: The tests of platform on X11 and on Wayland
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a cargo test -p platform
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=gitardo-tests --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston=$!
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/gitardo-tests" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/gitardo-tests" ]; then cat "$RUNNER_TEMP/weston.log"; exit 1; fi
          env -u DISPLAY WAYLAND_DISPLAY=gitardo-tests cargo test -p platform
          kill "$weston"
      # Both targets of the Mac are built, which with the check above closes M11 of the desktop (D48).
      - name: The other target of the Mac
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --workspace --target x86_64-apple-darwin
      - name: The desktop, in release
        run: cargo build --release -p app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.system }}
          path: |
            rust/target/release/gitardo
            rust/target/release/gitardo.exe
            rust/target/release/gitardo-cli
            rust/target/release/gitardo-cli.exe
          if-no-files-found: error

  engine:
    name: Engine for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            triple: x86_64-pc-windows-msvc
            os: windows-latest
          - target: win32-arm64
            triple: aarch64-pc-windows-msvc
            os: windows-latest
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: darwin-x64
            triple: x86_64-apple-darwin
            os: macos-latest
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            os: macos-latest
          - target: alpine-x64
            triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The C compiler for musl
        if: matrix.target == 'alpine-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: The target
        run: rustup target add ${{ matrix.triple }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: engine-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: gitardo-engine, in release
        run: cargo build --release --locked -p server --target ${{ matrix.triple }}
      - name: Laid out as scripts/package.mjs takes it
        run: |
          mkdir -p ../binaries/${{ matrix.target }}
          cp target/${{ matrix.triple }}/release/gitardo-engine* ../binaries/${{ matrix.target }}/
          rm -f ../binaries/${{ matrix.target }}/*.d ../binaries/${{ matrix.target }}/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: binaries/${{ matrix.target }}
          if-no-files-found: error

  extension:
    name: Extension (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            os: windows-latest
          - system: Linux
            os: ubuntu-latest
          - system: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The libraries VS Code needs on Linux, and a screen for it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64             libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev             libfontconfig1-dev libdbus-1-dev pkg-config
          # Ubuntu's AppArmor refuses the namespaces the sandbox of Electron makes, and VS Code is killed as it starts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: extension-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # The runners have no identity of their own for the commits the tests make, and Windows' git turns line endings
      # into CRLF on checkout, which the tests' repositories must not.
      - name: Git for the tests
        run: |
          git config --global user.name "Gitardo tests"
          git config --global user.email "tests@gitardo.invalid"
          git config --global core.autocrlf false
      # The tests find the debug binaries at ../rust/target/debug (docs/extension/06-testing.md, With the engine):
      # gitardo-engine, and gitardo-cli, which one test runs a feature through to compare.
      - name: gitardo-engine and gitardo-cli, the debug builds the tests use
        working-directory: rust
        run: cargo build -p server -p app --bin gitardo-engine --bin gitardo-cli
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run check:docs
      # The end-to-end suite runs in a real VS Code, the stable one, downloaded here and named by VSCODE_PATH.
      - name: VS Code
        run: |
          case "$RUNNER_OS" in
            Windows)
              curl -sSL -o "$RUNNER_TEMP/code.zip" "https://update.code.visualstudio.com/latest/win32-x64-archive/stable"
              mkdir -p "$RUNNER_TEMP/code" && unzip -q "$RUNNER_TEMP/code.zip" -d "$RUNNER_TEMP/code"
              echo "VSCODE_PATH=$RUNNER_TEMP/code/Code.exe" >> "$GITHUB_ENV" ;;
            Linux)
              curl -sSL -o "$RUNNER_TEMP/code.tar.gz" "https://update.code.visualstudio.com/latest/linux-x64/stable"
              mkdir -p "$RUNNER_TEMP/code" && tar -xzf "$RUNNER_TEMP/code.tar.gz" -C "$RUNNER_TEMP/code" --strip-components=1
              echo "VSCODE_PATH=$RUNNER_TEMP/code/code" >> "$GITHUB_ENV" ;;
            macOS)
              curl -sSL -o "$RUNNER_TEMP/code.zip" "https://update.code.visualstudio.com/latest/darwin-universal/stable"
              unzip -q "$RUNNER_TEMP/code.zip" -d "$RUNNER_TEMP"
              app="$RUNNER_TEMP/Visual Studio Code.app/Contents/MacOS"
              echo "VSCODE_PATH=$app/$(ls "$app" | head -n 1)" >> "$GITHUB_ENV" ;;
          esac
      - name: The end-to-end suite, with the engine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e; else npm run test:e2e; fi
      - name: The end-to-end suite, without it
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e -- --no-engine; else npm run test:e2e -- --no-engine; fi

  package:
    name: The vsix of every target
    needs: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: binaries
      # Each artifact comes down in a folder named after it: engine-<target>, which the script reads as <target>.
      - name: The engines, by target
        run: |
          cd ../binaries
          for folder in engine-*; do mv "$folder" "${folder#engine-}"; done
          ls -R
      - name: npm run package
        run: npm run package -- --every-target --binaries ../binaries
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/*.vsix
          if-no-files-found: error
