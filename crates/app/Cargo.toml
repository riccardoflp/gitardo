[package]
name = "app"
description = "Gitardo Desktop: the windows, the event loop, the store, the settings and what is kept between runs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gitardo"

[[bin]]
name = "gitardo"
path = "src/main.rs"

[[bin]]
name = "gitardo-cli"
path = "src/bin/gitardo-cli/main.rs"

[dependencies]
engine = { path = "../engine" }
features = { path = "../features" }
git = { path = "../git" }
model = { path = "../model" }

[dev-dependencies]
testkit = { path = "../testkit" }

[lints]
workspace = true
